<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sicilia Naturale</title>
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* VOICE: atlante sul campo, chiaro e asciutto, stile Wikiloc
   IDEA: la carta della Sicilia con i perimetri, e la scheda della zona che sale dal basso
   PICTURE: la mappa stessa, a tutto schermo
   COLOUR and TYPE: verde bosco #2d6a4f (intestazione, aree protette), azzurro Natura 2000, bianco; Roboto
   LAYOUT: intestazione verde, ricerca e filtri sopra la mappa, pannello bianco in basso */
:root{color-scheme:light;--g:#2d6a4f;--gd:#1b4332;--gl:#d8eee2;--n2k:#2f7ea8;--zps:#7a5ea8;--mare:#1d6fa5;--ink:#1f2421;--mute:#5d6862;--line:#e3e7e4;--bg:#fff}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.45 Roboto,system-ui,sans-serif;color:var(--ink);background:#eef1ee;display:flex;flex-direction:column}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex:none;z-index:5}
header h1{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:.1px}
.lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:16px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;font:500 13px Roboto,sans-serif;padding:6px 11px;min-height:32px;cursor:pointer}
.lang button.on{background:#fff;color:var(--g)}
#wrap{position:relative;flex:1}
#map{position:absolute;inset:0}
.top{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{position:relative;max-width:520px}
.search input{width:100%;height:46px;border-radius:23px;border:0;padding:0 44px 0 18px;font:16px Roboto,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.18);outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--g),0 2px 8px rgba(0,0,0,.18)}
.search .x{position:absolute;right:6px;top:5px;width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer;display:none}
.res{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-height:45vh;overflow:auto;max-width:520px;display:none}
.res button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;border-bottom:1px solid var(--line);font:15px Roboto,sans-serif;cursor:pointer;color:var(--ink)}
.res button small{display:block;color:var(--mute);font-size:13px}
.res button:hover,.res button:focus{background:var(--gl)}
.riga{display:flex;gap:8px;align-items:center;max-width:620px}
.riga .search{flex:1}
.livbtn{flex:none;height:46px;border:0;border-radius:23px;background:#fff;color:var(--gd);box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:7px;padding:0 16px 0 13px;font:500 15px Roboto,sans-serif;cursor:pointer}
.livbtn[aria-expanded=true]{background:var(--g);color:#fff}
.livbtn b{font-size:12px;font-weight:500;background:var(--gl);color:var(--gd);border-radius:9px;padding:1px 7px}
.liv{display:none;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:620px;max-height:calc(100vh - 190px);overflow:auto;padding:6px 14px 14px}
.liv.open{display:block}
.liv h4{font-size:12.5px;font-weight:500;color:var(--mute);margin:14px 0 4px;letter-spacing:.2px}
.liv .perche{font-size:13px;color:var(--mute);background:#f4f7f5;border-radius:10px;padding:8px 11px;margin:6px 0 4px;line-height:1.45}
.lv{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lv:last-child{border-bottom:0}
.lv .sw{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.lv .sw i{display:block}
.lv b{display:block;font-weight:500;font-size:15px}
.lv small{display:block;color:var(--mute);font-size:12.8px;line-height:1.4;margin-top:1px}
.sw-t{position:relative;width:42px;height:24px;border-radius:12px;background:#cdd5d0;border:0;flex:none;transition:background .15s;pointer-events:none}
.sw-t::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.lv.on .sw-t{background:var(--g)}.lv.on .sw-t::after{transform:translateX(18px)}
.cft{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 6px 40px}
.cft button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px 5px 8px;font:13px Roboto,sans-serif;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;min-height:32px}
.cft button i{width:11px;height:11px;border-radius:3px}
.cft button.on{border-color:var(--gd);background:#eef6f1;font-weight:500}
.cft .tutti{font-weight:500;color:var(--g)}
.liv select{width:100%;margin:4px 0 0;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font:14px Roboto,sans-serif;background:#fff;color:var(--ink)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -3px 16px rgba(0,0,0,.2);max-height:54%;display:none;flex-direction:column;max-width:640px;margin:0 auto}
@media(min-width:900px){
  #sheet{top:10px;bottom:10px;left:10px;right:auto;width:430px;max-width:none;max-height:none;margin:0;border-radius:18px;box-shadow:0 6px 28px rgba(0,0,0,.24)}
  #sheet .grip{display:none}
  .side .top{left:450px}
  .sh{padding-top:14px}
}
#sheet.open{display:flex}
#sheet.big{max-height:calc(100% - 10px)}
.grip{flex:none;display:flex;justify-content:center;padding:8px 0 2px;cursor:pointer;border:0;background:none;width:100%}
.grip span{width:42px;height:5px;border-radius:3px;background:#cfd6d2}
.sh{flex:none;display:flex;gap:10px;align-items:flex-start;padding:2px 16px 10px;border-bottom:1px solid var(--line)}
.sh h2{font-size:19px;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.sh .close{margin-left:auto;flex:none;width:40px;height:40px;border-radius:20px;border:0;background:#f0f3f1;font-size:20px;cursor:pointer;color:var(--mute)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:10px;background:var(--gl);color:var(--gd);margin-right:4px}
.badge.n2k{background:#dcebf4;color:#1c5577}.badge.zps{background:#ece4f6;color:#53407a}.badge.mare{background:#dbe9f5;color:#174f78}
.body{overflow:auto;padding:4px 16px 24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:#f4f7f5;border-radius:10px;padding:8px 10px}
.stats b{display:block;font-size:18px;white-space:nowrap}
.stats span{font-size:12px;color:var(--mute)}
h3{font-size:15px;margin:18px 0 8px;color:var(--gd)}
.note{font-size:13px;color:var(--mute);margin:4px 0 8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin:8px 0}
.bar .t{font-weight:500}.bar .t small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.bar .v{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/-1;height:7px;background:#edf1ee;border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--g);border-radius:4px}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:11px 0;font-weight:500;display:flex;justify-content:space-between;gap:8px;list-style:none;min-height:44px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';font-size:20px;color:var(--mute);transform:rotate(90deg);transition:transform .15s}
details[open] summary::after{transform:rotate(-90deg)}
summary em{font-style:normal;color:var(--mute);font-weight:400;margin-left:auto}
.list{columns:2 210px;column-gap:18px;font-size:14px;padding-bottom:10px}
.list div{break-inside:avoid;padding:2px 0}
.list i{color:var(--mute)}
.hab{font-size:14px;padding-bottom:10px}
.hab div{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.hab code{color:var(--mute);font:13px Roboto,sans-serif}
.hab span:last-child{white-space:nowrap;text-align:right;color:var(--mute)}
.links button{display:block;width:100%;text-align:left;border:0;background:#f4f7f5;border-radius:10px;padding:9px 12px;margin:6px 0;font:14px Roboto,sans-serif;cursor:pointer;color:var(--ink)}
.links button small{color:var(--mute)}
a{color:var(--g)}
.src{font-size:13px;color:var(--mute);margin-top:18px}
.pick .intro{font-size:13.5px;color:var(--mute);margin:10px 0 6px;line-height:1.45}
.pick button{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:12px;width:100%;text-align:left;border:0;background:#f6f8f7;border-radius:12px;padding:11px 12px 11px 0;margin:8px 0;font:15px Roboto,sans-serif;cursor:pointer;color:var(--ink);overflow:hidden}
.pick button:hover{background:#edf3ef}
.pick .bar5{border-radius:0 4px 4px 0}
.pick .ty{font-size:12px;font-weight:500;letter-spacing:.2px}
.pick .nm{display:block;font-weight:500;font-size:15.5px;margin:1px 0 3px}
.pick .su{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.pick .go{align-self:center;color:var(--mute);font-size:20px}
.legend{position:absolute;right:52px;bottom:28px;pointer-events:none;z-index:2;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend .lt{font-weight:500;margin-top:6px}
.legend{max-height:calc(100% - 150px);overflow:auto}
.badge.bv{background:#f6e1d4;color:#8a3a0e}.badge.am{background:#ece3d9;color:#5b3a1a}.badge.bs{background:#f1ead6;color:#6b531a}.badge.cf{background:#e1eedb;color:#2f5a1e}
.sp{font-size:16px;margin:12px 0 0;color:var(--gd)}
.racconto{font-size:15.5px;line-height:1.62;margin:12px 0 4px;color:#2a302c}
.racconto p{margin:0 0 9px}
.wiki{margin:14px 0 6px;border-radius:14px;background:#f4f7f5;overflow:hidden}
.wiki img{display:block;width:100%;max-height:240px;object-fit:cover;background:#e3e9e5}
.wiki .wt{padding:10px 13px 12px;font-size:14.5px;line-height:1.55}
.wiki .wt b{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:3px}
.wiki .cr{font-size:12px;color:var(--mute);margin-top:6px}
.gal{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.gal a{flex:none;display:block;width:150px;text-decoration:none;color:var(--mute);font-size:11.5px;line-height:1.3}
.gal img{display:block;width:150px;height:110px;object-fit:cover;border-radius:10px;background:#e3e9e5;margin-bottom:3px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:10px 0}.kv dt{color:var(--mute)}.kv dd{margin:0}
.maplibregl-ctrl-bottom-left{bottom:0}
.btn3d{position:absolute;right:10px;bottom:96px;z-index:2;width:40px;height:40px;border-radius:10px;border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);font:700 13px Roboto,sans-serif;color:var(--gd);cursor:pointer}
.btn3d.on{background:var(--g);color:#fff}
/* meteo */
.mt-luogo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.mt-luogo select{flex:1 1 260px;height:44px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;font:15px Roboto,sans-serif;background:#fff;color:var(--ink)}
.mt-luogo button{height:44px;border-radius:12px;border:1.5px solid var(--g);background:#fff;color:var(--g);font:500 14px Roboto,sans-serif;padding:0 14px;cursor:pointer}
.mt-box{background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.mt-box h3{margin:0 0 4px}
.mt-best{font-size:16px;line-height:1.5;margin:4px 0 10px}
.giorni{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gg{border-radius:12px;padding:8px 9px;background:#f4f7f5;font-size:12.5px;line-height:1.35;border:2px solid transparent}
.gg.best{border-color:var(--g);background:#eaf5ee}
.gg b{display:block;font-size:13.5px}
.gg .sc{display:flex;align-items:center;gap:6px;margin:5px 0 3px;font-weight:700;font-size:15px}
.gg .sc i{flex:1;height:6px;border-radius:3px;background:#e1e7e3;overflow:hidden;display:block}
.gg .sc i span{display:block;height:100%;border-radius:3px}
.gg small{color:var(--mute);display:block}
.pioggia{display:flex;align-items:flex-end;gap:2px;height:90px;margin:8px 0 2px}
.pioggia div{flex:1;background:#7fb0cf;border-radius:2px 2px 0 0;min-height:1px}
.pioggia div.f{background:#c9dfee}
.int{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.int button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font:500 14.5px Roboto,sans-serif;color:var(--ink);cursor:pointer;min-height:42px}
.int button.on{border-color:var(--g);background:#eaf5ee;color:var(--gd)}
.int button i{width:10px;height:10px;border-radius:50%}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sug .c{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:6px}
.sug .c b{font-size:16px}
.sug .c small{color:var(--mute);line-height:1.45}
.sug .c .az{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.sug .c .az button,.trk .az button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font:500 13px Roboto,sans-serif;color:var(--g);cursor:pointer;min-height:34px}
.reg{background:#fff;border-radius:16px;padding:14px 16px;margin:6px 0 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.reg .big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:500 16px Roboto,sans-serif;cursor:pointer;background:var(--g);color:#fff}
.reg .big.stop{background:#fff;color:var(--gd);border:2px solid var(--gd)}
.reg .live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.reg .live div{background:#f4f7f5;border-radius:10px;padding:8px 10px}.reg .live b{display:block;font-size:18px}.reg .live span{font-size:12px;color:var(--mute)}
.trk{display:flex;flex-direction:column;gap:8px}
.trk .t{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.trk .t b{display:block}.trk .t small{color:var(--mute)}
.trk .az{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pioggia-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
/* sezioni */
.sez{display:flex;gap:4px;margin:0 auto}
.sez button{display:flex;align-items:center;gap:7px;border:0;background:none;color:rgba(255,255,255,.8);font:500 14.5px Roboto,sans-serif;padding:7px 13px;border-radius:18px;cursor:pointer;min-height:36px}
.sez button svg{width:19px;height:19px;fill:currentColor}
.sez button.on{background:rgba(255,255,255,.18);color:#fff}
header h1{flex:none}
@media(max-width:899px){
  .sez{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;box-shadow:0 -1px 0 var(--line),0 -4px 14px rgba(0,0,0,.08);justify-content:space-around;margin:0;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .sez button{flex-direction:column;gap:2px;color:var(--mute);font-size:11.5px;padding:5px 10px;border-radius:12px;flex:1}
  .sez button svg{width:23px;height:23px}
  .sez button.on{background:none;color:var(--g)}
  .sez button.on svg{background:var(--gl);border-radius:12px;padding:2px 12px;width:47px;box-sizing:content-box;margin:-2px 0}
  #wrap{margin-bottom:62px}
  header h1{flex:1}
}
/* cataloghi */
.cat{position:absolute;inset:0;z-index:3;background:#f3f5f2;overflow:auto;display:none}
.cat.on{display:block}
.cat .in{max-width:1180px;margin:0 auto;padding:18px max(16px,3vw) 40px}
.cat h2{font-size:clamp(24px,3.4vw,32px);line-height:1.1;margin:4px 0 6px;color:var(--gd)}
.cat .lead{color:var(--mute);margin:0 0 14px;max-width:70ch}
.cat .cerca{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.cat .cerca input{flex:1 1 260px;height:44px;border-radius:22px;border:1.5px solid var(--line);padding:0 16px;font:16px Roboto,sans-serif;background:#fff;outline:none}
.cat .cerca input:focus{border-color:var(--g)}
.cat .grp{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.cat .grp button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font:13.5px Roboto,sans-serif;color:var(--ink);cursor:pointer;min-height:34px}
.cat .grp button.on{background:var(--g);border-color:var(--g);color:#fff}
.cat .grp button em{font-style:normal;opacity:.7;margin-left:4px}
.cat .cnt{font-size:13px;color:var(--mute);margin:0 0 10px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{border:0;background:#fff;border-radius:14px;overflow:hidden;text-align:left;padding:0;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink);font:inherit;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.card .ph{aspect-ratio:4/3;background:#e4eae5 center/cover no-repeat;display:grid;place-items:center;color:#b5c2b9}
.card .ph svg{width:38px;height:38px;fill:currentColor}
.card .tx{padding:9px 11px 11px}
.card i{display:block;font-weight:500;font-size:14.5px;line-height:1.25}
.card small{display:block;color:var(--mute);font-size:12px;margin-top:3px;line-height:1.35}
.card .tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:500;background:var(--gl);color:var(--gd);border-radius:8px;padding:1px 7px}
.altri{display:block;margin:16px auto 0;border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:20px;padding:9px 18px;font:500 14px Roboto,sans-serif;cursor:pointer}
.ownph{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px}
.ownph img{height:150px;border-radius:10px;flex:none}
.btnmap{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;border:0;background:var(--g);color:#fff;border-radius:12px;padding:11px;font:500 15px Roboto,sans-serif;cursor:pointer;margin:12px 0 4px}
.avviso{font-size:13px;background:#fff6e5;color:#6b4a07;border-radius:10px;padding:9px 12px;margin:12px 0}
.avmap{position:absolute;left:50%;transform:translateX(-50%);top:120px;z-index:3;display:none;background:rgba(31,36,33,.88);color:#fff;border-radius:18px;padding:8px 14px;font-size:13.5px;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
.gbifchip{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:3;display:none;background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:6px 6px 6px 14px;font-size:14px;align-items:center;gap:8px;max-width:calc(100% - 120px)}
.gbifchip.on{display:flex}
.gbifchip i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbifchip button{border:0;background:#f0f3f1;border-radius:14px;width:28px;height:28px;cursor:pointer;flex:none}
@media(min-width:900px){ .cat-on #sheet{left:auto;right:10px} }
