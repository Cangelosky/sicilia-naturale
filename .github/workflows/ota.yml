name: Aggiornamenti
# a ogni modifica del codice dell'app (cartella www) prepara il pacchetto per l'aggiornamento automatico
# e lo mette sul ramo "ota" (version.json + www.zip), letto dall'app all'avvio. Funziona solo con il repository pubblico.
on:
  push:
    branches: [main]
    paths: ['www/**', 'package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pacchetto
        run: |
          V="$(node -p "require('./package.json').version")+$(git log -1 --format=%h -- www package.json)"
          MIN="$(node -p "require('./package.json').apkMin || '0'")"
          echo "window.SN_VER = { v: '$V' };" > www/versione.js
          mkdir /tmp/ota && (cd www && zip -q -r -X /tmp/ota/www.zip . -x '.*')
          echo "$V" > /tmp/ota_v; echo "$MIN" > /tmp/ota_min; ls -la /tmp/ota
      - name: Ramo ota
        run: |
          # prima il pacchetto, poi version.json che punta al pacchetto per commit (indirizzo fisso, niente copie vecchie in cache)
          cd /tmp/ota && git init -q -b ota && git add www.zip \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Pacchetto $(cat /tmp/ota_v)"
          SHA=$(git rev-parse HEAD)
          echo "{\"v\":\"$(cat /tmp/ota_v)\",\"apkMin\":\"$(cat /tmp/ota_min)\",\"url\":\"https://raw.githubusercontent.com/${{ github.repository }}/$SHA/www.zip\"}" > version.json
          cat version.json && git add version.json \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Aggiornamento $(cat /tmp/ota_v)" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ota
