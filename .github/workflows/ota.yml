name: Aggiornamenti
# a ogni modifica del codice dell'app (cartella www) prepara il pacchetto per l'aggiornamento automatico
# e lo mette sul ramo "ota" (version.json + www.zip), letto dall'app all'avvio. Funziona solo con il repository pubblico.
on:
  push:
    branches: [main]
    paths: ['www/**', 'package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pacchetto
        run: |
          V="$(node -p "require('./package.json').version")+$(git log -1 --format=%h -- www package.json)"
          MIN="$(node -p "require('./package.json').apkMin || '0'")"
          echo "window.SN_VER = { v: '$V' };" > www/versione.js
          mkdir /tmp/ota && (cd www && zip -q -r -X /tmp/ota/www.zip . -x '.*')
          echo "$V" > /tmp/ota_v; echo "$MIN" > /tmp/ota_min; ls -la /tmp/ota
      - name: Ramo ota
        run: |
          # il pacchetto ha un nome per versione (www-<versione>.zip): niente copie vecchie in cache e
          # restano anche i due pacchetti precedenti, così un version.json ancora in cache punta sempre a un file esistente
          V="$(cat /tmp/ota_v)"; F="www-${V//+/-}.zip"
          mkdir -p /tmp/pub && cd /tmp/pub
          if git clone -q --depth 1 --branch ota "https://github.com/${{ github.repository }}" /tmp/vecchio; then
            head -n 2 /tmp/vecchio/elenco.txt 2>/dev/null | while read f; do [ -f "/tmp/vecchio/$f" ] && [ "$f" != "$F" ] && cp "/tmp/vecchio/$f" .; done || true
            head -n 2 /tmp/vecchio/elenco.txt 2>/dev/null | grep -v "^$F$" > /tmp/resto || true
          fi
          mv /tmp/ota/www.zip "$F"
          { echo "$F"; cat /tmp/resto 2>/dev/null; } > elenco.txt
          echo "{\"v\":\"$V\",\"apkMin\":\"$(cat /tmp/ota_min)\",\"url\":\"https://raw.githubusercontent.com/${{ github.repository }}/ota/$F\"}" > version.json
          cat version.json elenco.txt; ls -la
          git init -q -b ota && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Aggiornamento $V" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ota
