name: APK
# solo a mano (Actions > APK > Run workflow), quando Oscar dà l'ok: per seguire i lavori si usa il sito Netlify
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icone, versione
        run: |
          pip install --quiet pillow
          python3 tools/icone.py android
          V=$(node -p "require('./package.json').version")
          N=$(git rev-list --count HEAD)
          sed -i "s/versionName \"1.0\"/versionName \"$V\"/; s/versionCode 1/versionCode $N/" android/app/build.gradle
      - name: Permessi GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application#' $M
          grep -c uses-permission $M
      - name: Compatibilità aggiornamenti (Android 34)
        run: printf "\nconfigurations.all { resolutionStrategy { force 'androidx.work:work-runtime:2.9.1' } }\n" >> android/app/build.gradle
      - name: Chiave di firma fissa
        run: |
          G=android/app/build.gradle
          sed -i "0,/^android {/s##android {\n    signingConfigs { debug { storeFile file('../../tools/firma/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }#" $G
          grep -n signingConfigs $G
      - name: Versione del codice
        run: |
          echo "window.SN_VER = { v: '$(node -p "require('./package.json').version")+${GITHUB_SHA::7}' };" > www/versione.js
      - run: npx cap sync android
      - name: Costruisci APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rinomina
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk sicilia-naturale-$V.apk
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: sicilia-naturale-apk
          path: sicilia-naturale-*.apk
      # copia dell'APK su un ramo a parte, per poterla prendere senza passare dal sito
      - name: Ramo apk
        run: |
          mkdir /tmp/apk && cp sicilia-naturale-$V.apk /tmp/apk/
          cd /tmp/apk && git init -q -b apk && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "APK $V ($GITHUB_SHA)" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
