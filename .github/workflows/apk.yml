name: APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'package.json', 'capacitor.config.json', 'tools/icone.py', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Icone, versione
        run: |
          pip install --quiet pillow
          python3 tools/icone.py android
          V=$(node -p "require('./package.json').version")
          N=$(git rev-list --count HEAD)
          sed -i "s/versionName \"1.0\"/versionName \"$V\"/; s/versionCode 1/versionCode $N/" android/app/build.gradle
      - run: npx cap sync android
      - name: Costruisci APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rinomina
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk sicilia-naturale-$V.apk
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: sicilia-naturale-apk
          path: sicilia-naturale-*.apk
      # copia dell'APK su un ramo a parte, per poterla prendere senza passare dal sito
      - name: Ramo apk
        run: |
          mkdir /tmp/apk && cp sicilia-naturale-$V.apk /tmp/apk/
          cd /tmp/apk && git init -q -b apk && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "APK $V ($GITHUB_SHA)" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
